name: rmc-graphrag

services:
  neo4j:
    image: neo4j:5-community
    container_name: rmc-graphrag-db
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP (Browser)
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_V2_PASSWORD:?NEO4J_V2_PASSWORD must be set in .env}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    container_name: rmc-graphrag-api
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      NEO4J_V2_URI: bolt://neo4j:7687
      NEO4J_V2_USERNAME: neo4j
      NEO4J_V2_PASSWORD: ${NEO4J_V2_PASSWORD:?NEO4J_V2_PASSWORD must be set in .env}
      NEO4J_V2_DATABASE: neo4j
    volumes:
      - ./data:/app/data
      - ./ontology:/app/ontology

  web:
    build: ./web
    container_name: rmc-graphrag-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      # Next.js sunucu tarafı (server component) fetch'leri Docker ağı içinden gider.
      API_INTERNAL_URL: http://api:8000

volumes:
  neo4j_data:
  neo4j_logs:
