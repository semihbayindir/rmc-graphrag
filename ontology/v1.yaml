onay_notlari:
- API servis hesapları (*_livem_wsuser) Kullanıcı ve Yetki Yönetimi'nden API Erişimi'ne taşındı.
- DNS ve Gönderim Domaini, Email Deliverability altında birleştirildi (aynı ekip bakıyor).
- :Product düğümü kaldırıldı; tek ürün (RMC) var, tek değerli kök düğüm sorgu daraltmaz.
- 'Euromessage OMNICHANNEL: Email/SMS/Push/WebPush/WhatsApp hepsi campaign suite''inde.'
- Confluence'taki ayrı 'RMC Mobile' dalı SDK kılavuzudur, ayrı ürün değildir.
- WhatsApp ürün bilgisiyle eklendi (kanit=0); veri onu keşfedemezdi.
degisim_kurallari:
  enum_sadece_buyur: Yanlış modül silinmez; deprecated işaretlenir, superseded_by ile alias'a girer.
  yeni_modul: carved_from alanı zorunlu — geri doldurmayı sınırlar.
  null_serbest: Hiçbiri uymuyorsa module=null. Null'lar aylık drift raporunun girdisi.
  drift_tespiti: Kapalı-dünya içinden boşluk görülmez. Aylık örneklem, kısıtlı VE kısıtsız koşulup karşılaştırılır.
